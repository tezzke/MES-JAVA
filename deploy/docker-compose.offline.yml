name: mes

services:
  mysql:
    image: mysql:8.4.6
    pull_policy: never
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      TZ: Asia/Shanghai
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    volumes:
      - /opt/mes/mysql:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - MYSQL_PWD="$${MYSQL_PASSWORD}" mysqladmin ping -h 127.0.0.1 -u"$${MYSQL_USER}" --silent
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    security_opt:
      - no-new-privileges:true

  app:
    image: mes-app:${MES_VERSION:?MES_VERSION is required}
    pull_policy: never
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${SCANNER_BIND_ADDRESS:-0.0.0.0}:${SCANNER_PORT:-6001}:6001/tcp"
    expose:
      - "5100"
    volumes:
      - /opt/mes/telemetry:/app/data
      - /opt/mes/config:/app/config:ro
      - /opt/mes/backups:/app/backups
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: prod
      MES_VERSION: ${MES_VERSION}
      MES_BUSINESS_DB_ENABLED: "true"
      MES_BUSINESS_DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
      MES_BUSINESS_DB_USERNAME: ${MYSQL_USER}
      MES_BUSINESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      MES_BOOTSTRAP_ADMIN_PASSWORD: ${MES_BOOTSTRAP_ADMIN_PASSWORD:-}
      MES_SESSION_COOKIE_SECURE: "false"
      MES_ALLOWED_ORIGINS: ${MES_ALLOWED_ORIGIN:?MES_ALLOWED_ORIGIN is required}
      MES_TELEMETRY_DB_URL: jdbc:sqlite:/app/data/mes.db
      MES_DEVICES_CONFIG: /app/config/devices.json
      MES_PLANT_CONFIG: /app/config/plant.json
      MES_MODBUS_PROBE_ENABLED: ${MES_MODBUS_PROBE_ENABLED:-false}
      MES_MODBUS_PROBE_ALLOWED_CIDRS: ${MES_MODBUS_PROBE_ALLOWED_CIDRS:-}
      MES_MODBUS_PROBE_ALLOWED_PORTS: ${MES_MODBUS_PROBE_ALLOWED_PORTS:-502}
      MES_MODBUS_PROBE_MAX_CONCURRENT: ${MES_MODBUS_PROBE_MAX_CONCURRENT:-2}
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - http://localhost:5100/api/system/readiness
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 45s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

  nginx:
    image: mes-nginx:${MES_VERSION:?MES_VERSION is required}
    pull_policy: never
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${HTTP_BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:80/tcp"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost/nginx-health"]
      interval: 15s
      timeout: 3s
      retries: 5
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m
      - /var/run:size=1m
    security_opt:
      - no-new-privileges:true

networks:
  default:
    name: mes-internal
