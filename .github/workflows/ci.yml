name: MES CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: 后端测试
        working-directory: backend
        run: chmod +x mvnw && ./mvnw -B test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20.19.5"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖
        working-directory: frontend
        run: npm run verify:lock && npm ci
      - name: 前端测试与构建
        working-directory: frontend
        run: npm test && npm run build

  container-smoke:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    env:
      MYSQL_PASSWORD: ci-business-password
      MYSQL_ROOT_PASSWORD: ci-root-password
      MES_BOOTSTRAP_ADMIN_PASSWORD: ci-admin-password
      MES_ALLOWED_ORIGINS: http://localhost:5100
      MES_SESSION_COOKIE_SECURE: "false"
      MES_MODBUS_PROBE_ENABLED: "true"
      MES_MODBUS_PROBE_ALLOWED_CIDRS: "172.16.0.0/12"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: 校验 Compose 配置
        run: docker compose -f deploy/docker-compose.yml config --quiet
      - name: 启动双库应用
        run: docker compose -f deploy/docker-compose.yml up -d --build
      - name: 健康、登录与稳态指标烟测
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:5100/api/system/readiness >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker compose -f deploy/docker-compose.yml logs
              exit 1
            fi
            sleep 5
          done

          csrf_json=$(curl --fail --silent --cookie-jar cookies.txt \
            http://localhost:5100/api/auth/csrf)
          csrf_token=$(printf '%s' "$csrf_json" | jq -r '.token')
          for attempt in $(seq 1 30); do
            if curl --fail --silent --cookie cookies.txt --cookie-jar cookies.txt \
              -H "Content-Type: application/json" \
              -H "X-XSRF-TOKEN: $csrf_token" \
              -d '{"username":"admin","password":"ci-admin-password"}' \
              http://localhost:5100/api/auth/login >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              exit 1
            fi
            sleep 2
          done

          probe_status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --cookie cookies.txt \
            -H "Content-Type: application/json" \
            -H "X-XSRF-TOKEN: $csrf_token" \
            -d '{"host":"127.0.0.1","port":502}' \
            http://localhost:5100/api/modbus-probe/connect-test)
          test "$probe_status" = "403"

          sleep 60
          info=$(curl --fail --silent --cookie cookies.txt \
            http://localhost:5100/api/system/info)
          test "$(printf '%s' "$info" | jq -r '.droppedFrames')" = "0"
      - name: 输出失败日志
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs
      - name: 清理容器
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v
